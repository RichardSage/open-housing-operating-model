# Register of obligations for the regulation layer (England)
#
# One entry per law, regulation, standard or code. Links to the model are in links.csv.
# NOT LEGAL ADVICE. Check every entry against the source before relying on it.
#
# type:      act | regulations | standard | code
#              act/regulations = law; standard = Regulator of Social Housing standard or government standard
#              set through it; code = statutory code, protocol, funding conditions or sector code
# status:    in-force | partly-in-force | not-yet-in-force
# changes:   dated changes still to come. date can be YYYY, YYYY-MM or YYYY-MM-DD.
#            certainty: confirmed (in law or formally announced) | expected (announced, date not final)
# watch:     optional list of pages for the weekly watcher to check (defaults to url).
#            Only www.gov.uk and www.legislation.gov.uk links are checked automatically.
# last_checked: when someone last checked this entry against its source. The watcher
#            reports source updates after this date, so update it whenever you check an entry.

obligations:

