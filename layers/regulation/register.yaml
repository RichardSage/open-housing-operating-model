# ---------------------------------------------------------------- Homes, condition and safety
- id: awaabs-law
  name: Awaab's Law (Hazards in Social Housing Regulations 2025)
  type: regulations
  enforcer: Courts (tenants can enforce); Regulator of Social Housing
  status: partly-in-force
  in_force_from: "2025-10-27"
  summary: Fixed timescales to investigate and act on significant hazards. In force for damp and mould and emergency hazards.
  changes:
  - date: "2026-11-30"
    certainty: confirmed
    summary: "Phase 2: adds excess cold and heat, falls, fire and explosions, electrical hazards, hygiene and pests, structural collapse"
  - date: "2027"
    certainty: expected
    summary: "Phase 3: all remaining HHSRS hazards except overcrowding"
  url: https://www.gov.uk/government/publications/awaabs-law-phase-2-guidance-for-social-housing-landlords/awaabs-law-phase-2-guidance-for-social-landlords
  last_checked: "2026-11-14"

- id: hhsrs
