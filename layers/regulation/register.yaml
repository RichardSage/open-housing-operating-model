    certainty: confirmed
    summary: Reformed Decent Homes Standard applies to social and private rented homes
  url: https://www.gov.uk/government/consultations/consultation-on-a-reformed-decent-homes-standard-for-social-and-privately-rented-homes/outcome/consultation-on-a-reformed-decent-homes-standard-for-social-and-privately-rented-homes-government-response
