    name: Apply to rent a home
    pattern: apply
    uses: ["02.1", "02.2", "02.3"]
  - code: "S01.2"
    name: Rent a supported home
    pattern: apply
    uses: ["09.2.1", "09.2.4", "02.3"]
  - code: "S01.3"
    name: View a home and accept an offer
    pattern: book
    uses: ["02.4", "03.5.2"]

- code: "S02"
  name: Buy a home
  group: finding-a-home
  users: [applicants]
  goal: Buy a home, or part of one, that I can afford
  requests:
  - code: "S02.1"
    name: Buy a shared ownership home
    pattern: pay
    uses: ["10.1"]
  - code: "S02.2"
    name: Buy a Rent to Buy home
    pattern: pay
    uses: ["10.9.3", "10.9.4"]
  - code: "S02.3"
    name: Buy a home outright
    pattern: pay
    uses: ["10.9.1", "10.9.2"]

- code: "S03"
  name: Rent a commercial property
  group: finding-a-home
  users: [businesses]
  goal: Rent and run premises for my business
  requests:
  - code: "S03.1"
    name: Rent a commercial property
    pattern: apply
    uses: ["13.10.1", "13.10.2"]
  - code: "S03.2"
    name: Pay my commercial rent
    pattern: pay
    uses: ["13.10.3"]
  - code: "S03.3"
    name: Repair my commercial property
    pattern: book
    uses: ["13.10.4"]

