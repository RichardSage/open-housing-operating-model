# Open Housing Operating Model - services (the outside-in view)
#
# A service is something that helps someone do something, named the way they would say it.
# Each service has requests: the specific things people do within it, tagged with an interaction pattern.
# Each request lists the functions or activities from model/function-areas/ that it relies on ("uses").
#
# Service names and pattern groups are adapted, with thanks, from the Social housing service list by
# Design Patterns for Social Housing (https://www.designpatternsforsocialhousing.co.uk/), whose pattern groups
# were mapped from TPXImpact's work on local government services.
#
# Codes are permanent identifiers: never renumber or reuse them. See CONTRIBUTING.md.

patterns:
- id: apply
  name: Apply
  description: Ask for something that needs a decision about eligibility or suitability
- id: book
  name: Book
  description: Arrange for something to happen at a time that suits
- id: pay
  name: Pay
  description: Pay money, or agree how to pay it
- id: request
  name: Request
  description: Ask for help, permission or something to be provided
- id: tell
  name: Tell
  description: Report something or let the organisation know about a change
- id: check
  name: Check
  description: Find out information or the status of something

users:
- id: applicants
  name: People looking for a home
- id: tenants
  name: Tenants
- id: owners
  name: Shared owners and leaseholders
- id: community
  name: Neighbours, family and the wider community
- id: businesses
  name: Businesses
- id: colleagues
  name: Colleagues

groups:
- id: finding-a-home
  name: Finding a home
- id: moving
  name: Moving in, moving on
- id: my-home
  name: Looking after my home
- id: money
  name: Money
- id: my-tenancy
  name: My tenancy and details
- id: owning
  name: Owning my home
- id: where-i-live
  name: Where I live
- id: support
  name: Support
- id: having-a-say
  name: Having a say
- id: working-here
  name: Working here

