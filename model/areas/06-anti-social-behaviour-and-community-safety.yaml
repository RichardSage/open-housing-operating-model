  activities:
  - code: "06.6.1"
    name: Attend community safety partnership meetings
  - code: "06.6.2"
    name: Share information with police and council
  - code: "06.6.3"
    name: Manage ASB case reviews
  - code: "06.6.4"
    name: Coordinate with youth services and community groups
- code: "06.7"
