# Open Housing Operating Model - service area file
# Codes are permanent identifiers: never renumber or reuse them. See CONTRIBUTING.md.
code: "02"
name: Lettings & Allocations
domain: homes-and-customers
description: Matching people to homes and starting tenancies well
services:
- code: "02.1"
  name: Housing applications & nominations
  activities:
  - code: "02.1.1"
    name: Receive and process local authority nominations
  - code: "02.1.2"
    name: Assess housing applications and eligibility
  - code: "02.1.3"
    name: Maintain the housing register
  - code: "02.1.4"
    name: Review and close inactive applications
- code: "02.2"
  name: Advertising & shortlisting
  activities:
  - code: "02.2.1"
    name: Prepare property adverts
  - code: "02.2.2"
    name: Publish properties on choice-based lettings schemes
  - code: "02.2.3"
    name: Shortlist applicants against the allocations policy
  - code: "02.2.4"
    name: Verify bidder priority and banding
- code: "02.3"
  name: Pre-tenancy assessment
  activities:
  - code: "02.3.1"
    name: Verify applicant identity and right to rent
  - code: "02.3.2"
    name: Carry out affordability and income checks
  - code: "02.3.3"
    name: Assess support needs and tenancy readiness
  - code: "02.3.4"
    name: Obtain references and previous landlord history
- code: "02.4"
  name: Viewings & offers
  activities:
  - code: "02.4.1"
    name: Arrange accompanied viewings
  - code: "02.4.2"
    name: Make and record formal offers
  - code: "02.4.3"
    name: Manage refusals and re-offers
  - code: "02.4.4"
    name: Handle offer appeals and reviews
- code: "02.5"
  name: Tenancy sign-up
  activities:
  - code: "02.5.1"
    name: Prepare tenancy agreement and welcome pack
  - code: "02.5.2"
    name: Conduct sign-up meeting
  - code: "02.5.3"
    name: Set up rent account and payment method
  - code: "02.5.4"
    name: Notify utilities and council tax of new tenancy
- code: "02.6"
  name: New tenancy support
  activities:
  - code: "02.6.1"
    name: Carry out new tenancy visit
  - code: "02.6.2"
    name: Resolve early tenancy issues
  - code: "02.6.3"
    name: Check new tenant satisfaction after six weeks
- code: "02.7"
  name: Transfers & mutual exchanges
  activities:
  - code: "02.7.1"
    name: Process mutual exchange applications
  - code: "02.7.2"
    name: Inspect properties for mutual exchange
  - code: "02.7.3"
    name: Manage internal transfer and management move requests
  - code: "02.7.4"
    name: Carry out exchange checks with other landlords
- code: "02.8"
  name: Lettings policy & performance
  activities:
  - code: "02.8.1"
    name: Maintain allocations and lettings policy
  - code: "02.8.2"
    name: Monitor relet times and lettings outcomes
  - code: "02.8.3"
    name: Agree and review local lettings plans
